<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculadora de Média — Final</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="container">
    <h1>Calculadora de Média</h1>

    <label for="nome">Nome do estudante</label>
    <input id="nome" type="text" placeholder="Ex.: Maria Souza">

    <label for="n1">Nota 1</label>
    <input id="n1" type="number" min="0" max="10" step="0.1">
    <label for="n2">Nota 2</label>
    <input id="n2" type="number" min="0" max="10" step="0.1">
    <label for="n3">Nota 3</label>
    <input id="n3" type="number" min="0" max="10" step="0.1">

    <button id="calcular" type="button">Calcular</button>

    <section id="resultado" role="status" aria-live="polite"></section>
  </main>
</body>
</html>
