<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exercícios de fixação — Aula 02</title>
  <script src="script.js" defer></script>
</head>
<body>
  <main>
    <h1>Exercícios de fixação — Aula 02</h1>
    <p>Os exercícios 1, 2 e 3 aparecem no console (F12 → Console).</p>

    <h2>Exercício 4 — Saudação no DOM</h2>
    <label for="nome">Nome:</label>
    <input id="nome" type="text">
    <button id="saudar" type="button">Saudar</button>
    <p id="saudacao" role="status" aria-live="polite"></p>

    <h2>Exercício 5 — Classificação de temperatura</h2>
    <label for="temperatura">Temperatura (°C):</label>
    <input id="temperatura" type="number" step="0.1">
    <button id="classificar" type="button">Classificar</button>
    <p id="classificacao" role="status" aria-live="polite"></p>
  </main>
</body>
</html>
